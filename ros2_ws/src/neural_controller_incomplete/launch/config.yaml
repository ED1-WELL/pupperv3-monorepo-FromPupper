# Wheeled PD Controller - simple PD control for wheeled Pupper
wheeled_pd_controller:
  ros__parameters:
    # Joint names (same order as neural_controller)
    joint_names:
      [
        "leg_front_r_1",
        "leg_front_r_2",
        "leg_front_r_3",
        "leg_front_l_1",
        "leg_front_l_2",
        "leg_front_l_3",
        "leg_back_r_1",
        "leg_back_r_2",
        "leg_back_r_3",
        "leg_back_l_1",
        "leg_back_l_2",
        "leg_back_l_3",
      ]

    # Standing pose for legs (wheels use velocity control, so their values are 0)
    # Tune these for your desired standing height/angle
    default_joint_pos:
      [-0.75, 0.0, 0.0, 0.75, 0.0, 0.0, -0.75, 0.0, 0.0, 0.75, 0.0, 0.0]

    # Leg PD gains (position holding)
    leg_kp: 3.25
    leg_kd: 0.5

    # Wheel velocity gain (D-only control)
    # Start low and increase if wheels are too slow
    wheel_kd: 0.5

    # Robot geometry for differential drive
    wheel_separation: 0.167  # meters (left-right distance between wheels)
    wheel_radius: 0.04445   # meters

    # Safety limits
    max_wheel_velocity: 10.0  # rad/s

    # Control rate
    control_rate: 50.0  # Hz

    # Initialization (smooth transition to standing pose)
    init_duration: 2.0
    init_kp: 3.25
    init_kd: 0.5

# Wheel Reshaper - timed sequence for heat memory polymer transformation
wheel_reshaper:
  ros__parameters:
    joint_names:
      [
        "leg_front_r_1",
        "leg_front_r_2",
        "leg_front_r_3",
        "leg_front_l_1",
        "leg_front_l_2",
        "leg_front_l_3",
        "leg_back_r_1",
        "leg_back_r_2",
        "leg_back_r_3",
        "leg_back_l_1",
        "leg_back_l_2",
        "leg_back_l_3",
      ]

    # Standing pose (same as wheeled_pd_controller)
    default_joint_pos:
      [-0.75, 0.0, 0.0, 0.75, 0.0, 0.0, -0.75, 0.0, 0.0, 0.75, 0.0, 0.0]

    # PD gains for legs and wheels
    leg_kp: 3.25
    leg_kd: 0.5
    wheel_kp: 3.25
    wheel_kd: 0.5

    # Control rate (Hz)
    control_rate: 50.0

    # Initialization duration (seconds)
    init_duration: 2.0

    # Hold durations (seconds) — time for polymer to reshape under weight
    phase1_hold_duration: 30.0
    phase3_hold_duration: 30.0

    # Rotation angles (radians)
    backward_angle: 1.5708    # π/2 = 90°
    forward_angle: 0.7854     # π/4 = 45°

    # How long to interpolate each rotation (seconds)
    rotation_duration: 3.0

